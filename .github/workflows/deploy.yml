name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install KaTeX
        working-directory: lib
        run: npm ci

      - name: Restore compiled TLDRs
        uses: actions/cache@v4
        with:
          path: research/tldr/*/index.html
          key: tldr-html-${{ github.sha }}
          restore-keys: tldr-html-

      - name: Compile updated TLDRs
        env:
          TZ: America/Los_Angeles
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/compile-changed.sh

      - name: Remove build-only files
        run: rm -rf lib/node_modules

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
